name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: windows-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up .NET
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: 10.0.x

            - name: Restore dependencies
              run: dotnet restore MathGrapher.slnx

            - name: Build
              run: dotnet build MathGrapher.slnx --configuration Release --no-restore

            - name: Test
              run: dotnet test MathGrapher.slnx --configuration Release --no-build
